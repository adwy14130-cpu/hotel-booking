<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيت الحبيب ﷺ لحجز الفنادق</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
  body {
    background: linear-gradient(rgba(15, 76, 58, 0.6), rgba(15, 76, 58, 0.6)), 
                url('background.jpg') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    width: 100%;
    max-width: 1800px;
    min-height: 80vh;
    margin: 20px 0;
    padding: 40px;
  }

  .content { padding: 20px 0; }
  
  .page-title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    margin-bottom: 10px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
  }
  .page-subtitle {
    text-align: center;
    color: #fff;
    font-size: 18px;
    margin-bottom: 40px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
  }
  
  .city-cards { 
    display: flex; 
    gap: 30px; 
    justify-content: center; 
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .city-card {
    position: relative;
    width: 400px;
    height: 300px;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: none;
  }
  .city-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .city-card .card-image {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: transform 0.4s ease;
  }
  .city-card:hover .card-image {
    transform: scale(1.1);
  }
  .city-card .card-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, 
      rgba(0,0,0,0.3) 0%, 
      rgba(0,0,0,0.5) 50%, 
      rgba(0,0,0,0.7) 100%);
  }
  .city-card .card-content {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: white;
    z-index: 2;
    width: 100%;
  }
  .city-card .card-content .title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
  }
  .city-card .card-content .subtitle {
    font-size: 18px;
    opacity: 0.95;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  }

  .white-box {
    background: #fff;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
  .back-btn { background: none; border: none; color: #0f4c3a; font-size: 18px; cursor: pointer; font-weight: bold; }
  .add-hotel-btn {
    background: #d4af37; color: #fff; border: none; padding: 10px 20px;
    border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;
  }
  
  .hotel-item {
    background: #f8f9fa; 
    border-right: 5px solid #0f4c3a;
    padding: 20px; 
    margin-bottom: 15px; 
    border-radius: 10px;
    display: flex; 
    gap: 15px; 
    align-items: center;
    position: relative;
  }
  .hotel-images-preview {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .hotel-thumb {
    width: 80px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid #ddd;
    transition: transform 0.2s;
  }
  .hotel-thumb:hover { transform: scale(1.1); border-color: #0f4c3a; }
  .hotel-img-placeholder {
    width: 80px;
    height: 60px;
    background: #e0e0e0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
  }
  .hotel-info { flex: 1; }
  .hotel-info h3 { font-size: 18px; color: #0f4c3a; margin-bottom: 5px; }
  .hotel-info .street { font-size: 13px; color: #888; margin-bottom: 5px; }
  .hotel-info .price { font-size: 14px; color: #d4af37; font-weight: bold; margin-bottom: 5px; }
  .hotel-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn-small {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
  }
  .btn-edit { background: #2196F3; color: #fff; }
  .btn-delete { background: #f44336; color: #fff; }
  
  .book-btn {
    background: #25D366; color: #fff; border: none; padding: 12px 20px;
    border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;
  }

  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: bold; color: #0f4c3a; font-size: 16px; }
  input, select, textarea {
    width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 16px; transition: border 0.3s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #d4af37; }
  .row { display: flex; gap: 15px; }
  .row .form-group { flex: 1; }
  .submit-btn {
    width: 100%; padding: 18px; background: #25D366; color: #fff;
    border: none; border-radius: 10px; font-size: 18px; font-weight: bold;
    cursor: pointer; margin-top: 15px;
  }
  .note {
    background: #fff8e1; padding: 15px; border-radius: 10px;
    font-size: 14px; color: #7a5d00; text-align: center; margin-top: 20px;
  }
  .success-note {
    background: #e8f5e9; padding: 15px; border-radius: 10px;
    font-size: 14px; color: #2e7d32; text-align: center; margin-top: 20px;
    white-space: pre-line;
  }
  .error-note {
    background: #ffebee; padding: 15px; border-radius: 10px;
    font-size: 14px; color: #c62828; text-align: center; margin-top: 20px;
  }

  /* Image Upload Preview */
  .upload-preview {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .preview-img {
    width: 100px;
    height: 75px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #ddd;
  }
  .preview-placeholder {
    width: 100px;
    height: 75px;
    background: #f0f0f0;
    border: 2px dashed #ccc;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 12px;
  }

  /* Image Gallery Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
  }
  .modal-content {
    margin: auto;
    display: block;
    max-width: 90%;
    max-height: 90%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .modal-close {
    position: absolute;
    top: 20px;
    right: 40px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1001;
  }
  .modal-close:hover { color: #d4af37; }
  .modal-prev, .modal-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    padding: 20px;
    user-select: none;
  }
  .modal-prev:hover, .modal-next:hover { color: #d4af37; }
  .modal-prev { left: 20px; }
  .modal-next { right: 20px; }
  .modal-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 16px;
  }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    .container { padding: 15px; margin: 10px 0; }
    .page-title { font-size: 24px; }
    .page-subtitle { font-size: 14px; }
    .city-cards { flex-direction: row; gap: 15px; align-items: center; }
    .city-card { width: calc(50% - 10px); max-width: 200px; height: 220px; }
    .city-card .card-content .title { font-size: 20px; }
    .city-card .card-content .subtitle { font-size: 13px; }
    .white-box { padding: 20px; }
    .hotel-item { flex-direction: column; text-align: center; }
    .hotel-images-preview, .hotel-img-placeholder { justify-content: center; }
    .hotel-actions { justify-content: center; width: 100%; }
    .modal-prev, .modal-next { font-size: 30px; padding: 10px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="content">
      <!-- الصفحة الرئيسية -->
      <div id="view-home">
        <h1 class="page-title">🕋 بيت الحبيب ﷺ</h1>
        <p class="page-subtitle">لحجز فنادق مكة المكرمة والمدينة المنورة</p>
        <div class="city-cards">
          <div class="city-card" onclick="showHotels('makkah')">
            <div class="card-image" style="background-image: url('./makkah.jpg');"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
              <div class="title">فنادق مكة</div>
              <div class="subtitle">احجز الآن بالقرب من الحرم المكي</div>
            </div>
          </div>
          <div class="city-card" onclick="showHotels('madinah')">
            <div class="card-image" style="background-image: url('./madinah.jpg');"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
              <div class="title">فنادق المدينة</div>
              <div class="subtitle">احجز الآن بالقرب من المسجد النبوي</div>
            </div>
          </div>
        </div>
      </div>

      <!-- صفحة قائمة الفنادق -->
      <div id="view-hotels" class="hidden">
        <div class="white-box">
          <div class="top-bar">
            <button class="back-btn" onclick="showView('view-home')">→ رجوع</button>
            <h3 id="city-title" style="color: #0f4c3a;"></h3>
            <button class="add-hotel-btn hidden" id="admin-add-btn" onclick="showAddHotel()">+ إضافة فندق</button>
          </div>
          <div id="hotels-list"></div>
        </div>
      </div>

      <!-- صفحة إضافة/تعديل فندق -->
      <div id="view-add-hotel" class="hidden">
        <div class="white-box">
          <div class="top-bar">
            <button class="back-btn" onclick="showView('view-hotels')">→ رجوع</button>
            <h3 style="color: #0f4c3a;" id="form-title">إضافة فندق جديد</h3>
          </div>
          <input type="hidden" id="edit-hotel-id">
          
          <div class="form-group">
            <label>اسم الفندق *</label>
            <input type="text" id="hotel-name" placeholder="مثال: فندق هيلتون مكة">
          </div>
          
          <div class="form-group">
            <label>المدينة *</label>
            <select id="hotel-city">
              <option value="makkah">مكة المكرمة</option>
              <option value="madinah">المدينة المنورة</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>اسم الشارع *</label>
            <input type="text" id="hotel-street" placeholder="مثال: شارع إبراهيم الخليل">
          </div>
          
          <div class="form-group">
            <label>سعر الليلة بالريال *</label>
            <input type="number" id="hotel-price" placeholder="مثال: 500">
          </div>
          
          <div class="form-group">
            <label>صور الفندق (حتى 3 صور)</label>
            <input type="file" id="hotel-images" accept="image/*" multiple onchange="previewImages(this)">
            <small style="color: #666; display: block; margin-top: 5px;">💡 يمكن اختيار صورة واحدة أو صورتين أو 3 صور</small>
            <div class="upload-preview" id="upload-preview"></div>
            <div id="current-images-info" style="margin-top: 10px; color: #666;"></div>
          </div>
          
          <button class="submit-btn" style="background: #d4af37;" onclick="saveHotel()">💾 حفظ الفندق</button>
          <div id="save-success" class="success-note hidden"></div>
          <div id="save-error" class="error-note hidden"></div>
        </div>
      </div>

      <!-- صفحة نموذج الحجز -->
      <div id="view-booking" class="hidden">
        <div class="white-box">
          <div class="top-bar">
            <button class="back-btn" onclick="showView('view-hotels')">→ رجوع للفنادق</button>
            <h3 style="color: #0f4c3a;">بيانات الحجز</h3>
          </div>
          <form id="bookingForm">
            <div class="form-group">
              <label>الفندق المختار</label>
              <input type="text" id="selected-hotel" readonly style="background: #f0f0f0; color: #0f4c3a; font-weight: bold;">
              <input type="hidden" id="selected-city">
              <input type="hidden" id="selected-street">
              <input type="hidden" id="selected-images">
            </div>
            <div class="form-group">
              <label>الاسم بالكامل *</label>
              <input type="text" id="name" required placeholder="مثال: أحمد محمد علي">
            </div>
            <div class="form-group">
              <label>رقم الهاتف (واتساب) *</label>
              <input type="tel" id="phone" required placeholder="مثال: 01000000000">
            </div>
            <div class="form-group">
              <label>الجنسية *</label>
              <input type="text" id="nationality" required placeholder="مثال: مصري">
            </div>
            <div class="row">
              <div class="form-group">
                <label>تاريخ الدخول *</label>
                <input type="date" id="checkIn" required>
              </div>
              <div class="form-group">
                <label>تاريخ الخروج *</label>
                <input type="date" id="checkOut" required>
              </div>
            </div>
            <div class="row">
              <div class="form-group">
                <label>عدد الغرف *</label>
                <input type="number" id="rooms" min="1" value="1" required>
              </div>
              <div class="form-group">
                <label>نوع الغرفة *</label>
                <select id="roomType" required>
                  <option value="فردية">فردية</option>
                  <option value="مزدوجة">مزدوجة</option>
                  <option value="ثلاثية">ثلاثية</option>
                  <option value="رباعية">رباعية</option>
                  <option value="جناح">جناح</option>
                </select>
              </div>
            </div>
            <button type="submit" class="submit-btn">✅ إرسال الطلب عبر واتساب</button>
            <div class="note">⚠️ بعد الضغط سيتم فتح واتساب لإرسال الطلب مباشرة</div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Gallery Modal -->
  <div id="image-modal" class="modal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <span class="modal-prev" onclick="changeImage(-1)">&#10094;</span>
    <span class="modal-next" onclick="changeImage(1)">&#10095;</span>
    <img class="modal-content" id="modal-img">
    <div class="modal-counter" id="modal-counter"></div>
  </div>

<script>
  // ✅ رقم الواتساب
  const WHATSAPP_NUMBER = "201002395091";
  
  // 🔑 الكود السري للأدمن
  const ADMIN_SECRET = "bh2024secret";

  // 🏨 قائمة الفنادق
  let hotels = [
    { 
      id: 1, 
      name: "فندق هيلتون مكة", 
      city: "makkah", 
      street: "شارع إبراهيم الخليل", 
      price: "500", 
      images: ["https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400"] 
    },
    { 
      id: 2, 
      name: "فندق بولمان زمزم", 
      city: "makkah", 
      street: "شارع أجياد", 
      price: "450", 
      images: ["https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=400"] 
    },
    { 
      id: 3, 
      name: "فندق ماريوت المدينة", 
      city: "madinah", 
      street: "طريق الملك فهد", 
      price: "400", 
      images: ["https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=400"] 
    },
    { 
      id: 4, 
      name: "فندق الأنوار كيمبنسكي", 
      city: "makkah", 
      street: "شارع النخيل", 
      price: "600", 
      images: ["https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=400"] 
    }
  ];

  let currentCity = '';
  let currentImages = []; // للصور الجديدة اللي هتترفع
  let editingHotelId = null;
  let modalImages = [];
  let currentModalIndex = 0;

  // التحقق من الأدمن
  function checkAdminAccess() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('bh') === ADMIN_SECRET) {
      document.getElementById('admin-add-btn').classList.remove('hidden');
    }
  }
  checkAdminAccess();

  function showView(viewId) {
    document.getElementById('view-home').classList.add('hidden');
    document.getElementById('view-hotels').classList.add('hidden');
    document.getElementById('view-add-hotel').classList.add('hidden');
    document.getElementById('view-booking').classList.add('hidden');
    document.getElementById(viewId).classList.remove('hidden');
    document.getElementById('save-success').classList.add('hidden');
    document.getElementById('save-error').classList.add('hidden');
  }

  // عرض الفنادق
  function showHotels(city) {
    currentCity = city;
    const cityName = city === 'makkah' ? 'مكة المكرمة 🕋' : 'المدينة المنورة 🕌';
    document.getElementById('city-title').innerText = cityName;
    
    const listContainer = document.getElementById('hotels-list');
    listContainer.innerHTML = '';

    const cityHotels = hotels.filter(h => h.city === city);
    
    if (cityHotels.length === 0) {
      listContainer.innerHTML = '<p style="text-align:center; color:#777; padding:20px;">لا توجد فنادق مضافة حالياً.</p>';
    } else {
      cityHotels.forEach(hotel => {
        const div = document.createElement('div');
        div.className = 'hotel-item';
        
        // عرض الصور المصغرة
        let imagesHtml = '';
        if (hotel.images && hotel.images.length > 0) {
          imagesHtml = '<div class="hotel-images-preview">';
          hotel.images.forEach((img, idx) => {
            imagesHtml += `<img src="${img}" class="hotel-thumb" onclick="openGallery(${hotel.id}, ${idx})" title="صورة ${idx + 1}">`;
          });
          imagesHtml += '</div>';
        } else {
          imagesHtml = '<div class="hotel-img-placeholder"></div>';
        }
        
        // أزرار الأدمن (تعديل/حذف)
        let adminButtons = '';
        if (document.getElementById('admin-add-btn').classList.contains('hidden') === false) {
          adminButtons = `
            <div class="hotel-actions">
              <button class="btn-small btn-edit" onclick="editHotel(${hotel.id})">✏️ تعديل</button>
              <button class="btn-small btn-delete" onclick="deleteHotel(${hotel.id})">️ حذف</button>
            </div>
          `;
        }
        
        div.innerHTML = `
          ${imagesHtml}
          <div class="hotel-info">
            <h3>${hotel.name}</h3>
            <p class="street">📍 ${hotel.street || 'غير محدد'}</p>
            <p class="price">💰 ${hotel.price} ريال / الليلة</p>
          </div>
          <button class="book-btn" onclick="openBooking('${hotel.name}', '${city}', '${hotel.street || ''}')">احجز الآن</button>
          ${adminButtons}
        `;
        listContainer.appendChild(div);
      });
    }
    showView('view-hotels');
  }

  // فتح معرض الصور
  function openGallery(hotelId, startIndex) {
    const hotel = hotels.find(h => h.id === hotelId);
    if (!hotel || !hotel.images || hotel.images.length === 0) return;
    
    modalImages = hotel.images;
    currentModalIndex = startIndex;
    updateModalImage();
    document.getElementById('image-modal').style.display = 'block';
  }

  function updateModalImage() {
    document.getElementById('modal-img').src = modalImages[currentModalIndex];
    document.getElementById('modal-counter').innerText = `${currentModalIndex + 1} / ${modalImages.length}`;
  }

  function changeImage(direction) {
    currentModalIndex += direction;
    if (currentModalIndex < 0) currentModalIndex = modalImages.length - 1;
    if (currentModalIndex >= modalImages.length) currentModalIndex = 0;
    updateModalImage();
  }

  function closeModal() {
    document.getElementById('image-modal').style.display = 'none';
  }

  // إغلاق المعرض عند الضغط خارج الصورة
  document.getElementById('image-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // إغلاق المعرض بزر Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') changeImage(-1);
    if (e.key === 'ArrowRight') changeImage(1);
  });

  // عرض الصور قبل الرفع
  function previewImages(input) {
    const preview = document.getElementById('upload-preview');
    preview.innerHTML = '';
    currentImages = [];
    
    if (input.files && input.files.length > 0) {
      if (input.files.length > 3) {
        alert('يمكنك رفع 3 صور كحد أقصى');
        input.value = '';
        return;
      }
      
      Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImages.push(e.target.result);
          
          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'preview-img';
          preview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }
  }

  // إضافة فندق جديد
  function showAddHotel() {
    editingHotelId = null;
    document.getElementById('form-title').innerText = 'إضافة فندق جديد';
    document.getElementById('hotel-name').value = '';
    document.getElementById('hotel-city').value = 'makkah';
    document.getElementById('hotel-street').value = '';
    document.getElementById('hotel-price').value = '';
    document.getElementById('hotel-images').value = '';
    document.getElementById('upload-preview').innerHTML = '';
    document.getElementById('current-images-info').innerText = '';
    currentImages = [];
    showView('view-add-hotel');
  }

  // تعديل فندق موجود
  function editHotel(hotelId) {
    const hotel = hotels.find(h => h.id === hotelId);
    if (!hotel) return;
    
    editingHotelId = hotelId;
    document.getElementById('form-title').innerText = 'تعديل فندق';
    document.getElementById('hotel-name').value = hotel.name;
    document.getElementById('hotel-city').value = hotel.city;
    document.getElementById('hotel-street').value = hotel.street || '';
    document.getElementById('hotel-price').value = hotel.price;
    document.getElementById('hotel-images').value = '';
    document.getElementById('upload-preview').innerHTML = '';
    currentImages = [];
    
    // عرض الصور الحالية
    if (hotel.images && hotel.images.length > 0) {
      document.getElementById('current-images-info').innerHTML = 
        `📷 لديك ${hotel.images.length} صورة(s) محفوظة حالياً. لرفع صور جديدة، اختاريها من الجهاز.`;
    } else {
      document.getElementById('current-images-info').innerText = '';
    }
    
    showView('view-add-hotel');
  }

  // حذف فندق
  function deleteHotel(hotelId) {
    if (!confirm('هل أنتِ متأكدة من حذف هذا الفندق؟')) return;
    
    hotels = hotels.filter(h => h.id !== hotelId);
    alert('✅ تم حذف الفندق بنجاح! (لحذفه نهائياً، احذفيه من الكود على GitHub)');
    showHotels(currentCity);
  }

  // حفظ الفندق (إضافة أو تعديل)
  function saveHotel() {
    const name = document.getElementById('hotel-name').value.trim();
    const city = document.getElementById('hotel-city').value;
    const street = document.getElementById('hotel-street').value.trim();
    const price = document.getElementById('hotel-price').value.trim();
    
    if (!name || !street || !price) {
      alert('يرجى ملء جميع الحقول المطلوبة');
      return;
    }
    
    // تحديد الصور (الجديدة + القديمة لو في تعديل)
    let finalImages = [];
    if (editingHotelId) {
      const existingHotel = hotels.find(h => h.id === editingHotelId);
      if (existingHotel && existingHotel.images) {
        finalImages = [...existingHotel.images]; // الاحتفاظ بالصور القديمة
      }
    }
    
    // إضافة الصور الجديدة
    if (currentImages.length > 0) {
      finalImages = [...finalImages, ...currentImages];
      // التأكد من عدم تجاوز 3 صور
      if (finalImages.length > 3) {
        finalImages = finalImages.slice(0, 3);
        alert('تم حفظ أول 3 صور فقط (الحد الأقصى)');
      }
    }
    
    if (editingHotelId) {
      // تعديل فندق موجود
      const index = hotels.findIndex(h => h.id === editingHotelId);
      if (index !== -1) {
        hotels[index] = {
          id: editingHotelId,
          name,
          city,
          street,
          price,
          images: finalImages
        };
      }
    } else {
      // إضافة فندق جديد
      const newHotel = {
        id: Date.now(),
        name,
        city,
        street,
        price,
        images: finalImages
      };
      hotels.push(newHotel);
    }
    
    // عرض رسالة النجاح مع الكود
    const hotelData = editingHotelId 
      ? hotels.find(h => h.id === editingHotelId)
      : hotels[hotels.length - 1];
    
    const hotelJson = JSON.stringify(hotelData, null, 2);
    const successMsg = `✅ تم ${editingHotelId ? 'تعديل' : 'إضافة'} الفندق بنجاح!
    
📋 لإظهار التغييرات لجميع العملاء بشكل دائم، استبدلي الفندق في الكود على GitHub بالسطر التالي:

${hotelJson}

💡 ملاحظة: الصور محفوظة كـ Base64 (نص طويل). لو عايزة صور أخف، ارفعي الصور في GitHub واستخدمي الروابط مباشرة.`;
    
    document.getElementById('save-success').innerText = successMsg;
    document.getElementById('save-success').classList.remove('hidden');
    
    // تحديث القائمة
    showHotels(city);
  }

  // فتح الحجز
  function openBooking(hotelName, city, street) {
    document.getElementById('selected-hotel').value = hotelName;
    document.getElementById('selected-city').value = city;
    document.getElementById('selected-street').value = street;
    showView('view-booking');
  }

  // إرسال الطلب
  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const data = {
      hotel: document.getElementById('selected-hotel').value,
      street: document.getElementById('selected-street').value,
      city: document.getElementById('selected-city').value === 'makkah' ? 'مكة المكرمة' : 'المدينة المنورة',
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      nationality: document.getElementById('nationality').value,
      checkIn: document.getElementById('checkIn').value,
      checkOut: document.getElementById('checkOut').value,
      rooms: document.getElementById('rooms').value,
      roomType: document.getElementById('roomType').value
    };

    const message =
`🕋 *طلب حجز جديد - بيت الحبيب ﷺ*

🏢 *الفندق:* ${data.hotel}
📍 *المدينة:* ${data.city}
🛣️ *الشارع:* ${data.street}

👤 *الاسم:* ${data.name}
📞 *الهاتف:* ${data.phone}
🌍 *الجنسية:* ${data.nationality}

📅 *الدخول:* ${data.checkIn}
 *الخروج:* ${data.checkOut}
🛏️ *عدد الغرف:* ${data.rooms}
🏨 *نوع الغرفة:* ${data.roomType}

✨ برجاء تأكيد الإتاحة والسعر`;

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
  });
</script>
