<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيت الحبيب ﷺ لحجز الفنادق</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
  body {
    background: linear-gradient(rgba(15, 76, 58, 0.6), rgba(15, 76, 58, 0.6)), 
                url('background.jpg') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    width: 100%;
    max-width: 1800px;
    min-height: 80vh;
    margin: 20px 0;
    padding: 40px;
  }

  .content { padding: 20px 0; }
  
  .page-title {
    text-align: center;
    color: #fff;
    font-size: 32px;
    margin-bottom: 10px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
  }
  .page-subtitle {
    text-align: center;
    color: #fff;
    font-size: 18px;
    margin-bottom: 40px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
  }
  
  .city-cards { 
    display: flex; 
    gap: 30px; 
    justify-content: center; 
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .city-card {
    position: relative;
    width: 400px;
    height: 300px;
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: none;
  }
  .city-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .city-card .card-image {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: transform 0.4s ease;
  }
  .city-card:hover .card-image {
    transform: scale(1.1);
  }
  .city-card .card-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, 
      rgba(0,0,0,0.3) 0%, 
      rgba(0,0,0,0.5) 50%, 
      rgba(0,0,0,0.7) 100%);
  }
  .city-card .card-content {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: white;
    z-index: 2;
    width: 100%;
  }
  .city-card .card-content .title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
  }
  .city-card .card-content .subtitle {
    font-size: 18px;
    opacity: 0.95;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  }

  .white-box {
    background: #fff;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
  .back-btn { background: none; border: none; color: #0f4c3a; font-size: 18px; cursor: pointer; font-weight: bold; }
  .admin-icon {
    background: #d4af37;
    color: #fff;
    border: none;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .admin-icon:hover { background: #b8941f; transform: scale(1.1); }
  
  .hotel-item {
    background: #f8f9fa;
    border-right: 5px solid #0f4c3a;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }
  .hotel-info { flex: 1; }
  .hotel-info h3 { font-size: 18px; color: #0f4c3a; margin-bottom: 8px; }
  .hotel-info p { font-size: 14px; color: #666; }
  .book-btn {
    background: #25D366;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
  }
  .hotel-actions {
    display: none;
    gap: 8px;
    margin-right: 15px;
  }
  .hotel-actions.show { display: flex; }
  .action-btn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .edit-btn { background: #2196F3; color: #fff; }
  .edit-btn:hover { background: #1976D2; transform: scale(1.1); }
  .delete-btn { background: #f44336; color: #fff; }
  .delete-btn:hover { background: #d32f2f; transform: scale(1.1); }

  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: bold; color: #0f4c3a; font-size: 16px; }
  input, select {
    width: 100%;
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    transition: border 0.3s;
  }
  input:focus, select:focus { outline: none; border-color: #d4af37; }
  .row { display: flex; gap: 15px; }
  .row .form-group { flex: 1; }
  .submit-btn {
    width: 100%;
    padding: 18px;
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
  .note {
    background: #fff8e1;
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
    color: #7a5d00;
    text-align: center;
    margin-top: 20px;
  }

  .hidden { display: none; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    .container { padding: 15px; margin: 10px 0; }
    .page-title { font-size: 24px; }
    .page-subtitle { font-size: 14px; }
    .city-cards { flex-direction: row; gap: 15px; align-items: center; }
    .city-card { width: calc(50% - 10px); max-width: 200px; height: 220px; }
    .city-card .card-content .title { font-size: 20px; }
    .city-card .card-content .subtitle { font-size: 13px; }
    .white-box { padding: 20px; }
    .hotel-item { flex-direction: column; text-align: center; }
    .hotel-actions { margin-right: 0; margin-top: 10px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div id="view-home">
        <h1 class="page-title">🕋 بيت الحبيب ﷺ</h1>
        <p class="page-subtitle">لحجز فنادق مكة المكرمة والمدينة المنورة</p>
        <div class="city-cards">
          <div class="city-card" onclick="showHotels('makkah')">
            <div class="card-image" style="background-image: url('./makkah.jpg');"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
              <div class="title">فنادق مكة</div>
              <div class="subtitle">احجز الآن بالقرب من الحرم المكي</div>
            </div>
          </div>
          
          <div class="city-card" onclick="showHotels('madinah')">
            <div class="card-image" style="background-image: url('./madinah.jpg');"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
              <div class="title">فنادق المدينة</div>
              <div class="subtitle">احجز الآن بالقرب من المسجد النبوي</div>
            </div>
          </div>
        </div>
      </div>

      <div id="view-hotels" class="hidden">
        <div class="white-box">
          <div class="top-bar">
            <button class="back-btn" onclick="showView('view-home')">→ رجوع</button>
            <h3 id="city-title" style="color: #0f4c3a;"></h3>
            <button class="admin-icon" onclick="requestAdminPassword()" title="إدارة">️</button>
          </div>
          <div id="hotels-list"></div>
        </div>
      </div>

      <div id="view-add-hotel" class="hidden">
        <div class="white-box">
          <div class="top-bar">
            <button class="back-btn" onclick="showView('view-hotels')">→ رجوع</button>
            <h3 style="color: #0f4c3a;" id="form-title">إضافة فندق جديد</h3>
          </div>
          <input type="hidden" id="edit-hotel-id">
          <div class="form-group">
            <label>اسم الفندق</label>
            <input type="text" id="new-hotel-name" placeholder="مثال: فندق هيلتون">
          </div>
          <div class="form-group">
            <label>المدينة</label>
            <select id="new-hotel-city">
              <option value="makkah">مكة المكرمة</option>
              <option value="madinah">المدينة المنورة</option>
            </select>
          </div>
          <div class="form-group">
            <label>اسم الشارع</label>
            <input type="text" id="new-hotel-street" placeholder="مثال: شارع إبراهيم الخليل">
          </div>
          <div class="form-group">
            <label>سعر الليلة بالريال</label>
            <input type="number" id="new-hotel-price" placeholder="مثال: 500">
          </div>
          <div class="form-group">
            <label>رابط صورة الفندق (اختياري)</label>
            <input type="url" id="new-hotel-image" placeholder="https://example.com/hotel.jpg">
          </div>
          <button class="submit-btn" style="background: #d4af37;" onclick="saveHotel()">💾 حفظ الفندق</button>
          <div class="note">️ ملاحظة: لتغيير دائم، عدلي الكود على GitHub</div>
        </div>
      </div>

      <div id="view-booking" class="hidden">
        <div class="white-box">
          <div class="top-bar">
            <button class="back-btn" onclick="showView('view-hotels')">→ رجوع للفنادق</button>
            <h3 style="color: #0f4c3a;">بيانات الحجز</h3>
          </div>
          <form id="bookingForm">
            <div class="form-group">
              <label>اسم الفندق المختار</label>
              <input type="text" id="selected-hotel" readonly style="background: #f0f0f0; color: #0f4c3a; font-weight: bold;">
              <input type="hidden" id="selected-city">
            </div>
            <div class="form-group">
              <label>الاسم بالكامل *</label>
              <input type="text" id="name" required placeholder="مثال: أحمد محمد علي">
            </div>
            <div class="form-group">
              <label>رقم الهاتف (واتساب) *</label>
              <input type="tel" id="phone" required placeholder="مثال: 01000000000">
            </div>
            <div class="form-group">
              <label>الجنسية *</label>
              <input type="text" id="nationality" required placeholder="مثال: مصري">
            </div>
            <div class="row">
              <div class="form-group">
                <label>تاريخ الدخول *</label>
                <input type="date" id="checkIn" required>
              </div>
              <div class="form-group">
                <label>تاريخ الخروج *</label>
                <input type="date" id="checkOut" required>
              </div>
            </div>
            <div class="row">
              <div class="form-group">
                <label>عدد الغرف *</label>
                <input type="number" id="rooms" min="1" value="1" required>
              </div>
              <div class="form-group">
                <label>نوع الغرفة *</label>
                <select id="roomType" required>
                  <option value="فردية">فردية</option>
                  <option value="مزدوجة">مزدوجة</option>
                  <option value="ثلاثية">ثلاثية</option>
                  <option value="رباعية">رباعية</option>
                  <option value="جناح">جناح</option>
                </select>
              </div>
            </div>
            <button type="submit" class="submit-btn">✅ إرسال الطلب عبر واتساب</button>
            <div class="note">⚠️ بعد الضغط سيتم فتح واتساب لإرسال الطلب مباشرة</div>
          </form>
        </div>
      </div>
    </div>
  </div>

<script>
  const WHATSAPP_NUMBER = "201002395091";
  const ADMIN_PASSWORD = "admin123";
  let isAdmin = false;

  let hotels = [
    { id: 1, name: "فندق هيلتون مكة", city: "makkah", street: "شارع إبراهيم الخليل", price: "500 ريال/ليلة", image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400" },
    { id: 2, name: "فندق بولمان زمزم", city: "makkah", street: "شارع أجياد", price: "450 ريال/ليلة", image: "https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=400" },
    { id: 3, name: "فندق ماريوت المدينة", city: "madinah", street: "طريق الملك فهد", price: "400 ريال/ليلة", image: "https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=400" },
    { id: 4, name: "فندق الأنوار كيمبنسكي", city: "makkah", street: "شارع النخيل", price: "600 ريال/ليلة", image: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=400" }
  ];

  let currentCity = '';

  function showView(viewId) {
    document.getElementById('view-home').classList.add('hidden');
    document.getElementById('view-hotels').classList.add('hidden');
    document.getElementById('view-add-hotel').classList.add('hidden');
    document.getElementById('view-booking').classList.add('hidden');
    document.getElementById(viewId).classList.remove('hidden');
  }

  function requestAdminPassword() {
    const password = prompt('أدخلي كلمة السر للإدارة:');
    if (password === ADMIN_PASSWORD) {
      isAdmin = true;
      alert('✅ تم تفعيل وضع الإدارة - يمكنك الآن إضافة/تعديل/حذف الفنادق');
      showHotels(currentCity);
    } else {
      alert('❌ كلمة السر غير صحيحة');
    }
  }

  function showHotels(city) {
    currentCity = city;
    const cityName = city === 'makkah' ? 'مكة المكرمة 🕋' : 'المدينة المنورة ';
    document.getElementById('city-title').innerText = cityName;
    
    const listContainer = document.getElementById('hotels-list');
    listContainer.innerHTML = '';

    const cityHotels = hotels.filter(h => h.city === city);
    
    if (cityHotels.length === 0) {
      listContainer.innerHTML = '<p style="text-align:center; color:#777; padding:20px;">لا توجد فنادق مضافة حالياً.</p>';
    } else {
      cityHotels.forEach(hotel => {
        const div = document.createElement('div');
        div.className = 'hotel-item';
        
        const actionsHtml = isAdmin ? `
          <div class="hotel-actions show">
            <button class="action-btn edit-btn" onclick="editHotel(${hotel.id})" title="تعديل">✏️</button>
            <button class="action-btn delete-btn" onclick="deleteHotel(${hotel.id})" title="حذف">🗑️</button>
          </div>
        ` : '';
        
        div.innerHTML = `
          <div class="hotel-info">
            <h3>${hotel.name}</h3>
            <p>📍 ${hotel.street || 'غير محدد'}</p>
            <p>💰 ${hotel.price || 'السعر عند الطلب'}</p>
          </div>
          <button class="book-btn" onclick="openBooking('${hotel.name}', '${city}')">احجز الآن</button>
          ${actionsHtml}
        `;
        listContainer.appendChild(div);
      });
    }
    showView('view-hotels');
  }

  function addNewHotel() {
    document.getElementById('form-title').innerText = 'إضافة فندق جديد';
    document.getElementById('edit-hotel-id').value = '';
    document.getElementById('new-hotel-name').value = '';
    document.getElementById('new-hotel-city').value = 'makkah';
    document.getElementById('new-hotel-street').value = '';
    document.getElementById('new-hotel-price').value = '';
    document.getElementById('new-hotel-image').value = '';
    showView('view-add-hotel');
  }

  function editHotel(hotelId) {
    const hotel = hotels.find(h => h.id === hotelId);
    if (!hotel) return;
    
    document.getElementById('form-title').innerText = 'تعديل فندق';
    document.getElementById('edit-hotel-id').value = hotelId;
    document.getElementById('new-hotel-name').value = hotel.name;
    document.getElementById('new-hotel-city').value = hotel.city;
    document.getElementById('new-hotel-street').value = hotel.street || '';
    document.getElementById('new-hotel-price').value = hotel.price || '';
    document.getElementById('new-hotel-image').value = hotel.image || '';
    showView('view-add-hotel');
  }

  function deleteHotel(hotelId) {
    if (confirm('هل أنتِ متأكدة من حذف هذا الفندق؟')) {
      hotels = hotels.filter(h => h.id !== hotelId);
      alert('✅ تم الحذف (للحذف الدائم، احذفيه من الكود على GitHub)');
      showHotels(currentCity);
    }
  }

  function saveHotel() {
    const name = document.getElementById('new-hotel-name').value;
    const city = document.getElementById('new-hotel-city').value;
    const street = document.getElementById('new-hotel-street').value;
    const price = document.getElementById('new-hotel-price').value;
    const image = document.getElementById('new-hotel-image').value;
    const editId = document.getElementById('edit-hotel-id').value;

    if (!name) { alert('يرجى كتابة اسم الفندق'); return; }

    if (editId) {
      const index = hotels.findIndex(h => h.id === parseInt(editId));
      if (index !== -1) {
        hotels[index] = { id: parseInt(editId), name, city, street, price: price + ' ريال/ليلة', image };
        alert('✅ تم التعديل (للحفظ الدائم، عدلي الكود على GitHub)');
      }
    } else {
      hotels.push({ id: Date.now(), name, city, street, price: price + ' ريال/ليلة', image });
      alert('✅ تمت الإضافة (للحفظ الدائم، أضيفيه في الكود على GitHub)');
    }
    
    showHotels(city);
  }

  function openBooking(hotelName, city) {
    document.getElementById('selected-hotel').value = hotelName;
    document.getElementById('selected-city').value = city;
    showView('view-booking');
  }

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const data = {
      hotel: document.getElementById('selected-hotel').value,
      city: document.getElementById('selected-city').value === 'makkah' ? 'مكة المكرمة' : 'المدينة المنورة',
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      nationality: document.getElementById('nationality').value,
      checkIn: document.getElementById('checkIn').value,
      checkOut: document.getElementById('checkOut').value,
      rooms: document.getElementById('rooms').value,
      roomType: document.getElementById('roomType').value
    };

    const message = `🕋 *طلب حجز جديد - بيت الحبيب *\n\n🏢 *الفندق:* ${data.hotel}\n📍 *المدينة:* ${data.city}\n\n👤 *الاسم:* ${data.name}\n📞 *الهاتف:* ${data.phone}\n🌍 *الجنسية:* ${data.nationality}\n\n📅 *الدخول:* ${data.checkIn}\n📅 *الخروج:* ${data.checkOut}\n🛏️ *عدد الغرف:* ${data.rooms}\n🏨 *نوع الغرفة:* ${data.roomType}\n\n✨ برجاء تأكيد الإتاحة والسعر`;

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
  });
</script>
</body>
</html>
